<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen Image Chat</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-top">
      <button id="newChat" class="side-btn" title="新しいチャット">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        新しいチャット
      </button>
    </div>
    <div class="side-label">チャット履歴</div>
    <nav id="convList"></nav>
    <div class="side-bottom">
      <div id="statusBox" class="status"><span class="dot"></span><span class="status-text">接続確認中…</span></div>
      <button id="openSettings" class="side-btn ghost">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        設定
      </button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="toggleSidebar" class="icon-btn" title="サイドバー">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="model-pick">
        <select id="modelSelect" title="モデル">
          <option value="turbo">Qwen-Image-2.1 Turbo（高速・8ステップ）</option>
          <option value="base">Qwen-Image-2.1（高品質・30ステップ）</option>
        </select>
      </div>
      <div id="convTitle"></div>
    </header>

    <section id="chat">
      <div id="empty" class="empty">
        <h1>何を描きましょう？</h1>
        <p>文章で頼むだけで画像を生成します。画像を添付すると、その画像を指示どおりに編集します。<br>
          生成後に「もっと明るく」「背景を夜にして」のように続ければ、直前の画像を編集します。</p>
        <div class="chips">
          <button class="chip">雨の夜の東京の路地裏、ネオン看板に「深夜食堂」の文字、映画のワンシーン風</button>
          <button class="chip">ふわふわの白い子猫が桜の木の下で昼寝している水彩画</button>
          <button class="chip">未来都市の上空を飛ぶクジラ、横長のファンタジーイラスト</button>
          <button class="chip">「Qwen Coffee」というロゴのおしゃれなカフェのメニュー表、縦長</button>
        </div>
      </div>
      <div id="messages"></div>
    </section>

    <footer id="composerWrap">
      <div id="composer">
        <div id="attachments"></div>
        <div class="compose-row">
          <button id="attachBtn" class="icon-btn" title="画像を添付（貼り付け・ドラッグ＆ドロップも可）">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M21 12.5l-8.5 8.5a5.5 5.5 0 01-7.8-7.8L13.2 4.7a3.7 3.7 0 015.2 5.2l-8.5 8.5a1.8 1.8 0 01-2.6-2.6l7.8-7.8" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input id="fileInput" type="file" accept="image/*" multiple hidden>
          <textarea id="input" rows="1" placeholder="作りたい画像や、編集の指示を入力…（Enterで送信 / Shift+Enterで改行）"></textarea>
          <button id="sendBtn" class="send-btn" title="送信">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="opt-row">
          <label class="opt"><span>モード</span>
            <select id="modeSelect">
              <option value="auto">自動判定</option>
              <option value="generate">新規生成</option>
              <option value="edit">編集</option>
            </select></label>
          <label class="opt"><span>比率</span>
            <select id="aspectSelect">
              <option value="auto">自動</option>
              <option value="1:1">1:1 正方形</option>
              <option value="4:3">4:3</option>
              <option value="3:4">3:4</option>
              <option value="3:2">3:2 横長</option>
              <option value="2:3">2:3 縦長</option>
              <option value="16:9">16:9 ワイド</option>
              <option value="9:16">9:16 スマホ</option>
            </select></label>
          <label class="opt"><span>画質</span>
            <select id="qualitySelect">
              <option value="fast">高速（約1MP）</option>
              <option value="standard">標準（約2MP）</option>
              <option value="high">高精細（約4MP）</option>
            </select></label>
          <label class="opt toggle" title="ローカルLLMで指示文を詳しいプロンプトに書き換えます">
            <input type="checkbox" id="llmToggle"><span>プロンプト強化</span></label>
        </div>
      </div>
      <div class="hint">Qwen-Image-2.1 · stable-diffusion.cpp (Vulkan) · すべてローカルで実行</div>
    </footer>
  </main>
</div>

<div id="dropOverlay"><div>画像をドロップして添付</div></div>

<div id="lightbox" hidden>
  <img id="lightboxImg" alt="">
  <button id="lightboxClose" class="icon-btn" title="閉じる">✕</button>
</div>

<dialog id="settingsDlg">
  <form method="dialog">
    <h2>設定</h2>
    <label class="row"><input type="checkbox" id="setPreview"> 生成中のプレビューを表示</label>
    <div class="row small" id="setInfo"></div>
    <div class="dlg-actions"><button value="close">閉じる</button></div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
